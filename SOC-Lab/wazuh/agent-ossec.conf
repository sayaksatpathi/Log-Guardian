<!--
Reference snippets only. Merge the relevant sections into the existing Wazuh
agent ossec.conf. Do not overwrite the complete file. Confirm paths and event
channel names for your endpoint OS and Wazuh version.
-->
<ossec_config>
  <!-- Windows: collect structured Windows event channels. -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Linux: common authentication and system logs. Validate paths per distro. -->
  <localfile>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/syslog</location>
    <log_format>syslog</log_format>
  </localfile>
</ossec_config>
