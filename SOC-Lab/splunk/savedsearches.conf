# Example Splunk saved searches. Confirm index/sourcetype/field extraction first.
# Copy into an app's local/savedsearches.conf only after testing the matching SPL.

[SOC - Windows Failed Logon Burst]
search = index=main (EventCode=4625 OR EventID=4625) | eval account=coalesce(TargetUserName, Account_Name, user) | eval src=coalesce(IpAddress, Source_Network_Address, src_ip) | stats count as failures by account src host | where failures >= 10
description = Detects repeated failed Windows logons. Triage source, account, host, and time window; do not assume compromise.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SOC - New Local Account]
search = index=main (EventCode=4720 OR EventID=4720)
description = Detects local or domain account creation events. Validate requester, ticket, and account purpose.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SOC - Privileged Group Membership Change]
search = index=main (EventCode=4728 OR EventCode=4732 OR EventID=4728 OR EventID=4732)
description = Detects member additions to security-enabled groups. Validate group criticality and approved change.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
