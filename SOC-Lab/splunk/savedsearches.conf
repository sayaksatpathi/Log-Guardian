[SOC - Windows Security Log Cleared]
search = index=main (EventCode=1102 OR EventID=1102)
description = Windows Security audit log cleared. Confirm maintenance and investigate unexpected clearing.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
