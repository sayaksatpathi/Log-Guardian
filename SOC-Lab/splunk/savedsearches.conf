# Splunk saved searches for the SOC-Lab detections.
# Import into an app's local/savedsearches.conf after validating index and fields.
# Searches are disabled by default; set enableSched = 1 only after test data is
# indexed, field extraction is confirmed, and a test alert has been reviewed.

[SOC - Windows Failed Logon Burst]
search = index=main (EventCode=4625 OR EventID=4625) | eval account=coalesce(TargetUserName, Account_Name, user, SubjectUserName) | eval src=coalesce(IpAddress, Source_Network_Address, src_ip, SourceAddress) | stats count as failures min(_time) as first_seen max(_time) as last_seen values(Computer) as hosts by account src | where failures >= 5
description = Five or more failed Windows logons for an account and source in the search window.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SOC - Failed Logons Followed by Success]
search = index=main (EventCode=4625 OR EventCode=4624 OR EventID=4625 OR EventID=4624) | eval event_id=tonumber(coalesce(EventCode, EventID, event_id)) | eval account=coalesce(TargetUserName, Account_Name, user, SubjectUserName) | eval src=coalesce(IpAddress, Source_Network_Address, src_ip, SourceAddress) | stats count(eval(event_id=4625)) as failures count(eval(event_id=4624)) as successes by account src | where failures >= 5 AND successes >= 1
description = Failed logon burst followed by a successful logon for same account and source in the search window.
cron_schedule = */5 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SOC - New Account Created]
search = index=main (EventCode=4720 OR EventID=4720)
description = Windows account creation event. Confirm approved request and account owner.
cron_schedule = */5 * * * *
