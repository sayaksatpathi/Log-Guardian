[SOC - Linux SSH Authentication Failure Burst]
search = index=main (sourcetype=linux_secure OR sourcetype=syslog) ("Failed password" OR "authentication failure") | stats count as failures min(_time) as first_seen max(_time) as last_seen by host user src | where failures >= 5
description = Repeated SSH or authentication failures. Confirm source and correlate with successful sessions.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[SOC - Authentication Outcomes Over Time]
search = index=main (EventCode=4624 OR EventCode=4625 OR EventID=4624 OR EventID=4625) | eval outcome=if(tonumber(coalesce(EventCode,EventID))=4625,"Failure","Success") | timechart span=15m count by outcome
description = Authentication outcome timechart for the SOC-Lab dashboard; this is a panel search, not a notable alert.
enableSched = 0
